services:
  cassandra:
    build:
      context: ./cassandra
      dockerfile: Dockerfile
    image: shehanhetti/cassandra:latest
    ports:
      - "9042:9042"
    volumes:
      - cassandra-data:/var/lib/cassandra
    environment:
      - CASSANDRA_CLUSTER_NAME=inference_cluster
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'DESCRIBE KEYSPACES'"]
      interval: 10s
      timeout: 10s
      retries: 10

  inference_service:
    build:
      context: ./inference
      dockerfile: Dockerfile
    image: shehanhetti/inference-service:latest
    ports:
      - "8000:8000"
    depends_on:
      cassandra:
        condition: service_healthy
    volumes:
      - ./app:/app
    command: >
      sh -c "uvicorn main:app --host 0.0.0.0 --port 8000"

volumes:
  cassandra-data: